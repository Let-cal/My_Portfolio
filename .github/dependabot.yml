version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    groups:
      npm-patch-and-minor:
        update-types: [minor, patch]
    # Majors that need a planned migration: ESLint 10 (eslint-config-next support) and
    # @types/node beyond the Node 22 runtime pinned in engines and .nvmrc.
    ignore:
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        versions: ['>=23']
    commit-message:
      prefix: 'deps'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:45'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
