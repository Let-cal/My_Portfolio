name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  admin-integration:
    name: Disposable admin Auth, CRUD and RLS
    # This fills the signed-in backend gap; it never repeats the public suite.
    # Docker needs a native ephemeral runner; no hosted secrets or services.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Exercise the real disposable backend and admin UI
        # The launcher verifies Docker, Chrome, ownership and loopback destinations.
        # The runner's preinstalled Chrome avoids another apt/browser download.
        run: |
          env -i \
            PATH="$PATH" HOME="$RUNNER_TEMP/task4-bootstrap" TMPDIR="$RUNNER_TEMP" \
            CI=true NEXT_TELEMETRY_DISABLED=1 \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            node scripts/ci/run-admin-integration.mjs
      - name: Upload sanitized integration evidence only
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/admin-integration-summary.json
          if-no-files-found: error
          retention-days: 3

  performance:
    name: Lighthouse mobile (a11y, SEO and CLS gate; performance advisory)
    needs: quality
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    # Lock the exact runtime pulled in the approved benchmark; keep SDK version aligned.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Build production
        run: npm run build
      - name: Measure the three locales and the project archive (median of three runs)
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start -p 3100 -H 127.0.0.1 > "$RUNNER_TEMP/performance-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/en > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          export CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')"
          # Accessibility, SEO and CLS fail the job; performance, LCP and TBT are reported as warnings.
          PERF_ORIGIN=http://127.0.0.1:3100 npm run check:performance
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lighthouseci/
            ${{ runner.temp }}/performance-server.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Lint, types, unit tests and budgets
    # Standard Linux runners are free for this public repository. Do not opt into larger runners.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false
      - name: Set up pinned font verification tools
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Generated files are current
        run: npm run check:generated
      - name: Unit tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=reports/unit.xml
      - name: Production build and generated Next.js types
        run: npm run build
      - name: Type check including generated route types
        run: npx --no-install tsc --noEmit
      - name: Initial JavaScript budget
        run: npm run check:bundle
      - name: Artifact and script budgets
        run: npm run test:budgets
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 3

  browser-shards:
    name: Playwright shard ${{ matrix.shard }}/2
    needs: quality
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    # Browsers/fonts/system libraries are preinstalled; avoid repeating apt downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Plan duration-balanced groups from the full inventory
        run: |
          mkdir -p reports
          npx --no-install playwright test --project=chromium --list --reporter=json > reports/browser-inventory.json
          node .github/scripts/plan-browser-groups.mjs reports/browser-inventory.json .github/browser-timings.json reports/groups
      - name: Browser shard against the production server
        # The existing config builds and starts port 3100; CI disables server reuse.
        # Run one browser at a time: SwiftShader rendering competes for the runner CPU.
        # --test-list already partitions the inventory; native --shard would omit cases.
        run: npx --no-install playwright test --project=chromium --workers=1 --test-list=reports/groups/group-${{ matrix.shard }}.txt --fail-on-flaky-tests --reporter=list,json,blob
        env:
          CI_BROWSER_GROUP: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/browser-${{ matrix.shard }}.json
      - name: Upload this run's synthetic browser evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            reports/browser-${{ matrix.shard }}.json
            reports/groups/plan.json
            blob-report/*.zip
          if-no-files-found: error
          retention-days: 3

  browser:
    # Preserve the existing required-check name; a matrix alone cannot prove completeness.
    name: Playwright Chromium on Linux
    needs: [quality, browser-shards]
    if: always() && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful shard jobs
        env:
          SHARD_RESULT: ${{ needs.browser-shards.result }}
        run: test "$SHARD_RESULT" = success
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Download only this run and attempt's shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: playwright-shard-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: browser-reports
          merge-multiple: false
      - name: Discover the complete unchanged test inventory
        run: |
          mkdir -p reports
          npx --no-install playwright test --project=chromium --list --reporter=json > reports/browser-inventory.json
      - name: Reject missing, stale, duplicated, skipped or flaky evidence
        run: node .github/scripts/merge-browser-reports.mjs browser-reports reports/browser-inventory.json
      - name: Merge verified blob reports
        run: npx --no-install playwright merge-reports --reporter=html browser-reports/verified-blobs
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload merged synthetic browser report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 3
