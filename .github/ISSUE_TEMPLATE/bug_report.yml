name: Bug report / 不具合報告
description: Report a reproducible problem with the portfolio.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        English or Japanese is welcome. For vulnerabilities, use https://github.com/Let-cal/My_Portfolio/security/advisories/new instead. Remove secrets and unrelated personal data from attachments.
        日本語でも報告できます。脆弱性は公開せず、上記フォームから非公開でご報告ください。
  - type: input
    id: revision
    attributes:
      label: URL or revision / URL・リビジョン
      description: Include the route and commit SHA if known. Remove private query parameters.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 再現手順
      description: Include role, locale, theme, and motion preference when relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 期待する動作・実際の動作
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 実行環境
      description: Browser/version, operating system, device or viewport, input method, and GPU renderer if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / 確認資料
      description: Optional screenshots, sanitized logs, or measurements with tool versions and run conditions. Review private traces before sharing.
